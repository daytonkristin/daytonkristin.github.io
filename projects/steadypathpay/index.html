<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteadyPath Pay | Systemic Resilience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #020617;
            --emerald: #10B981;
            --white: #ffffff;
        }
        body {
            background-color: var(--navy);
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .shield {
            width: 100px;
            height: 120px;
            border: 2px solid var(--emerald);
            border-radius: 10% 10% 50% 50%;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            position: relative;
            background: linear-gradient(to right, transparent 49%, var(--emerald) 49%, var(--emerald) 51%, transparent 51%);
            background-size: 100% 100%;
        }
        h1 { font-size: 3rem; font-weight: 300; margin: 0; letter-spacing: -1px; }
        h1 span { color: var(--emerald); font-weight: 600; }
        .tagline { opacity: 0.8; font-size: 1.2rem; margin-top: 10px; max-width: 500px; }
        .footer { position: absolute; bottom: 20px; font-size: 0.8rem; opacity: 0.5; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="shield"></div>
    <h1>SteadyPath<span>Pay</span></h1>
    <p class="tagline">Modern fintech infrastructure built with a human-centered tone — calm, forgiving, and trustworthy.</p>
    <div class="footer">RECOVERY • REDUNDANCY • PROTECTION</div>
</body>
</html>
